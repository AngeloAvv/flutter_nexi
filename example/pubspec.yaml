publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_nexi:
    path: ../

  cupertino_icons: ^1.0.9
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true